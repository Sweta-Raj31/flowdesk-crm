services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node src/server.js"
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/flowdesk
      JWT_SECRET: change-this-in-production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      SEED_DB: "true"
    depends_on:
      - mongo
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - backend
volumes:
  mongo_data:
